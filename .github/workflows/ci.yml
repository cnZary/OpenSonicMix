name: CI

on:
  push:
    branches: [main, master]
  pull_request:

jobs:
  build:
    name: Build and test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Build
        run: dotnet build SonicCubePanel.slnx -c Release --nologo

      - name: Test
        run: dotnet test SonicCube.Protocol.Tests/SonicCube.Protocol.Tests.csproj -c Release --no-build
